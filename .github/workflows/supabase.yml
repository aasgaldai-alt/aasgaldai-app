name: Supabase сервер суулгах
on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: idvxeqblgerfdkdnktab
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Өгөгдлийн сангийн бүтэц
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          sql = open("supabase/schema.sql").read()
          req = urllib.request.Request(
              "https://api.supabase.com/v1/projects/%s/database/query" % os.environ["REF"],
              data=json.dumps({"query": sql}).encode(),
              headers={"Authorization": "Bearer " + os.environ["SUPABASE_ACCESS_TOKEN"], "Content-Type": "application/json", "User-Agent": "aasgaldai-deploy"})
          try:
              out = urllib.request.urlopen(req).read().decode()[:3000]
              print(out); print("::notice title=sql::" + out.replace("\n", " ")[:900])
          except urllib.error.HTTPError as e:
              out = e.read().decode()[:3000]
              print("HTTP", e.code, out); print("::error title=sql::HTTP %d %s" % (e.code, out.replace("\n", " ")[:900])); raise
          PY
      - name: API функц суулгах
        run: supabase functions deploy api --project-ref "$REF" --no-verify-jwt --use-api
      - name: Шалгах
        run: |
          reg=$(curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$REF" | python3 -c "import sys,json; print(json.load(sys.stdin).get('region',''))")
          echo "::notice title=region::$reg"
          sleep 3
          r=$(curl -sS -X POST "https://$REF.supabase.co/functions/v1/api?forceFunctionRegion=$reg" -H "Content-Type: text/plain" -d '{"action":"login","login":"deploycheck","pin":"0"}' -w " http=%{http_code} t=%{time_total}")
          echo "::notice title=login-check::$r"
          h=$(curl -sS -D - -o /dev/null -X POST "https://$REF.supabase.co/functions/v1/api?forceFunctionRegion=$reg" -H "Origin: https://app.aasgaldai.mn" -H "Content-Type: text/plain;charset=utf-8" -d '{"action":"__ping"}' | grep -i "access-control-allow-origin" | tr -d '\r')
          echo "::notice title=cors::$h"
          for q in "?forceFunctionRegion=$reg" "?forceFunctionRegion=$reg"; do
            r=$(curl -sS -X POST "https://$REF.supabase.co/functions/v1/api$q" -H "Content-Type: text/plain" -d '{"action":"__selftest"}' -w " http=%{http_code} t=%{time_total}")
            echo "$r"; echo "::notice title=selftest $q::$r"
          done
