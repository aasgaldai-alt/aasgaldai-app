<!doctype html>
<html lang="mn">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Аасгалдай">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Аасгалдай</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#ffffff">
<style>
/* Layout: phone-first app shell — top bar, scrolling list of request cards, fixed bottom tab bar */
:root{
  --bg:#f3f6fb; --panel:#ffffff; --ink:#141b2b; --muted:#5a6478; --line:#dbe2ee; --soft:#e9eef7;
  --accent:#1546c9; --accent-ink:#ffffff; --accent-soft:#e2ebfc;
  --brand-o:#f07800; --brand-y:#e6bf00; --brand-g:#3a9a1a; --brand-sky:#18a8ec;
  --ok:#2f8a14; --ok-soft:#e3f2dc;
  --warn:#a35a00; --warn-soft:#fdf0d8; --bad:#c2330f; --bad-soft:#fbe4dc; --info:#1546c9; --info-soft:#e2ebfc;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1220; --panel:#151c2c; --ink:#e4e9f4; --muted:#97a2b8; --line:#263049; --soft:#1c2538;
  --accent:#6aa5ff; --accent-ink:#07122b; --accent-soft:#1a2b4d;
  --brand-o:#ff9a3d; --brand-y:#f2d04a; --brand-g:#6cc04a; --brand-sky:#4cc0f5;
  --ok:#6cc04a; --ok-soft:#1d3317;
  --warn:#f0b04e; --warn-soft:#3a2b14; --bad:#ff8a6b; --bad-soft:#3d1f17; --info:#6aa5ff; --info-soft:#1a2b4d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1220; --panel:#151c2c; --ink:#e4e9f4; --muted:#97a2b8; --line:#263049; --soft:#1c2538;
  --accent:#6aa5ff; --accent-ink:#07122b; --accent-soft:#1a2b4d;
  --brand-o:#ff9a3d; --brand-y:#f2d04a; --brand-g:#6cc04a; --brand-sky:#4cc0f5;
  --ok:#6cc04a; --ok-soft:#1d3317;
  --warn:#f0b04e; --warn-soft:#3a2b14; --bad:#ff8a6b; --bad-soft:#3d1f17; --info:#6aa5ff; --info-soft:#1a2b4d; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%} body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);color:var(--ink);box-shadow:0 1px 0 var(--line)}
header.bar::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:linear-gradient(90deg,var(--brand-o),var(--brand-y) 35%,var(--brand-g) 55%,var(--brand-sky) 78%,var(--accent))}
header.bar .logo{width:38px;height:38px;flex:none;display:block}
header.bar .wrap{display:flex;align-items:center;gap:10px;padding-block:12px}
header.bar h1{font-size:17px;font-weight:600;margin:0;flex:1;min-width:0}
header.bar h1 small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
header.bar button{background:transparent;border:1px solid var(--line);color:var(--ink)}
main{padding-block:14px 110px;display:flex;flex-direction:column;gap:12px}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
button.danger{color:var(--bad);border-color:var(--bad)}
button.big{width:100%;padding:13px;font-size:16px}
button:disabled{opacity:.5}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.req{display:flex;flex-direction:column;gap:6px}
.req .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.req .what{font-weight:600;min-width:0}
.req .amt{font-family:var(--mono);font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.req .meta{font-size:13px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--ink)}
.st{font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap}
.st-wait{background:var(--warn-soft);color:var(--warn)}
.st-ok{background:var(--info-soft);color:var(--info)}
.st-paid{background:var(--ok-soft);color:var(--ok)}
.st-no{background:var(--bad-soft);color:var(--bad)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 12px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.form{display:flex;flex-direction:column;gap:14px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row2>*{min-width:0} input[type=date]{min-width:0;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:8px 12px;border-radius:999px;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.preview{font-family:var(--mono);font-size:13px;background:var(--soft);border-radius:8px;padding:10px;word-break:break-word}
.photo img{max-width:100%;border-radius:8px;display:block}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:flex}
nav.tabs button{flex:1;border:none;border-radius:0;background:none;flex-direction:column;gap:2px;padding:9px 4px 10px;font-size:12px;color:var(--muted);position:relative}
nav.tabs button .ic{font-size:19px;line-height:1}
nav.tabs.many button{font-size:10.5px;padding-left:1px;padding-right:1px;letter-spacing:-.02em}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:11px;font-weight:600;border-radius:999px;padding:0 6px;min-width:18px;line-height:18px}
.copyrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.copyrow:last-child{border-bottom:none}
.copyrow .k{font-size:12px;color:var(--muted);width:92px;flex:none}
.copyrow .v{flex:1;min-width:0;font-family:var(--mono);font-size:14px;word-break:break-all;user-select:all}
.copyrow button{padding:6px 10px;font-size:13px;flex:none}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90vw}
.banner{padding:10px 12px;border-radius:9px;font-size:13px;background:var(--warn-soft);color:var(--ink)}
.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sum .card .l{font-size:12px;color:var(--muted)}
.sum .card .v{font-family:var(--mono);font-size:18px;font-weight:500;margin-top:2px}
.seg{display:flex;background:var(--soft);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:none;padding:7px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--panel);font-weight:600}
.login{display:flex;flex-direction:column;gap:14px;padding-top:20px}
.pin{letter-spacing:.5em;text-align:center;font-family:var(--mono);font-size:22px}
.muted{color:var(--muted)} .small{font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions>*{flex:1}
.fin{display:flex;flex-direction:column}
.fin .ln{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.fin .ln:last-child{border-bottom:none}
.fin .ln .n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.fin .ln.sub{color:var(--muted)}
.fin .ln.tot{font-weight:600;border-bottom:1px solid var(--line)}
.fin .ln.big{font-size:16px;font-weight:600;border-bottom:none;padding-top:10px}
.pl{display:flex;flex-direction:column;gap:4px}
.pl>div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:4px 0}
.pl>div:last-child{border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.pl .l{font-size:14px;color:var(--muted)}
.pl .v{font-family:var(--mono);font-weight:500;font-size:17px;white-space:nowrap}
.pl>div:last-child .v{font-size:20px;font-weight:600}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat3 .card{padding:11px;border-top-width:3px}
.stat3 .ok{border-top-color:var(--ok)} .stat3 .wt{border-top-color:var(--warn)} .stat3 .no{border-top-color:var(--bad)}
.stat3 .l{font-size:12px;color:var(--muted)}
.stat3 .c{font-size:20px;font-weight:600;line-height:1.2}
.stat3 .s{font-family:var(--mono);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{display:flex;flex-direction:column;gap:7px}
.hb .r{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;font-size:13px}
.hb .t{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.hb .t i{display:block;height:100%;background:linear-gradient(90deg,var(--brand-o),var(--brand-y));border-radius:5px}
.hb .n{font-family:var(--mono);font-size:12.5px}
h3.sec{font-size:13px;font-weight:600;color:var(--muted);margin:4px 2px 0;text-transform:none}
.urow{display:flex;align-items:center;gap:10px}
.urow .nm{flex:1;min-width:0}
.urow .nm b{display:block}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{width:auto}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--soft)}
.split i{display:block;height:100%}
table.tx{width:100%;border-collapse:collapse;font-size:14px}
table.tx th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
table.tx td{padding:7px 6px;border-bottom:1px dashed var(--line);vertical-align:top}
table.tx .num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.tx tr.sep td{border-top:1px solid var(--line)}
table.tx tr.tot td{font-weight:600;border-bottom:none;border-top:1px solid var(--line)}
.vatnote{margin-top:10px;padding:10px 12px;border-radius:9px;background:var(--accent-soft);font-size:13px;line-height:1.5;border-left:4px solid var(--brand-y)}
.vatnote.warn{background:var(--warn-soft);border-left-color:var(--brand-o)}
#netbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:4;background:var(--bad);color:#fff;text-align:center;font-size:13px;padding:7px 16px}
.ovl{position:fixed;inset:0;z-index:30;background:rgba(10,15,30,.5);display:flex;align-items:center;justify-content:center;padding:20px}
.dlg{background:var(--panel);border-radius:16px;padding:24px 20px 18px;max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px}
.dlg .ic{width:60px;height:60px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;color:#fff}
.dlg .ic.ok{background:var(--ok)} .dlg .ic.no{background:var(--bad)}
.dlg h2{margin:4px 0 0;font-size:18px} .dlg p{margin:0;color:var(--muted);font-size:14px}
.attc{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-top:4px}
.attc button{flex-direction:column;gap:1px;padding:7px 1px;font-size:10.5px;letter-spacing:-.01em;line-height:1.15;border-radius:9px;min-width:0}
.attc button span{font-size:17px}
.mealart{display:block;margin:0 auto}
.mealart .stm path{animation:steam 2.4s ease-in-out infinite;opacity:.0}
.mealart .stm .s2{animation-delay:.6s} .mealart .stm .s3{animation-delay:1.2s}
@keyframes steam{0%{transform:translateY(8px);opacity:0}40%{opacity:.9}100%{transform:translateY(-10px);opacity:0}}
.mealdlg{position:relative;overflow:hidden;border-top:6px solid var(--brand-o)}
.mealdlg h2{margin:2px 0}
.confetti span{position:absolute;top:-30px;font-size:22px;animation:fall 2.8s ease-in infinite}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(420px) rotate(320deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.mealart .stm path{animation:none;opacity:.8}.confetti{display:none}}
.pattc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:4px}
.pattc button{flex-direction:column;gap:1px;padding:6px 2px;font-size:11.5px;line-height:1.15;border-radius:9px;min-width:0}
.pattc button span{font-size:16px}
.plist{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:8px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;font-size:13px}
.cal b{font-size:11px;color:var(--muted);font-weight:500}
.cal span{padding:6px 0;border-radius:7px;background:var(--bg);font-family:var(--mono)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
@media (min-width:900px){
  body{background:var(--soft)}
  header.bar .wrap{max-width:none;padding-left:24px;padding-right:24px}
  header.bar h1{font-size:18px}
  nav.tabs{top:calc(65px + env(safe-area-inset-top,0px));bottom:0;left:0;right:auto;width:236px;border-top:0;border-right:1px solid var(--line);padding:14px 12px;overflow-y:auto;background:var(--panel)}
  nav.tabs .wrap{flex-direction:column;gap:4px;padding:0;max-width:none}
  nav.tabs button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;font-size:14.5px;border-radius:10px;color:var(--ink);text-align:left}
  nav.tabs button .ic{font-size:18px;width:34px;display:flex;justify-content:center;flex:none}
  nav.tabs button .ic svg{width:34px;height:19px}
  nav.tabs button:hover{background:var(--soft)}
  nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  nav.tabs.many button{font-size:14.5px;letter-spacing:0}
  nav.tabs .badge{position:static;margin-left:auto}
  nav.tabs:not([hidden]) ~ main.wrap,body:has(nav.tabs:not([hidden])) main.wrap{margin-left:max(260px,calc(236px + (100vw - 236px - 920px)/2));margin-right:auto}
  main.wrap{max-width:920px;padding-block:24px 48px;padding-left:24px;padding-right:24px;gap:14px}
  .toast{bottom:28px}
  .login{max-width:420px;margin:40px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px}
  .sum{grid-template-columns:repeat(4,minmax(0,1fr))}
  .dlg{max-width:440px}
}

</style>

function taxBreak(s){

  const dot=c=>`<i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${c};margin-right:6px"></i>`;
  const row=(l,n,a,extra="",cls="")=>`<tr class="${cls}"><td>${l}${extra}</td><td class="num">${n}</td><td class="num">${fmt(a)}</td><td class="num muted">${pc(a)}</td></tr>`;
  const bar=(a,c)=>`<i style="width:${ts?a/ts*100:0}%;background:${c}"></i>`;
  return `<h3 class="sec">Баримтын төрөл (баталгаажсан зардал)</h3><div class="card">

   ${row(dot("var(--brand-o)")+"Баримтгүй",nn,ns)}
   ${row("Нийт зардал",tn,ts,"","tot")}</table></div>
   ${nn?`<div class="banner" style="margin-top:10px">Баримтгүй <b>${nn}</b> зардал, <b>${fmt(ns)} ₮</b> байна. Ажилчдад худалдан авалт бүрт баримт авахыг сануулна уу.</div>`:`<div class="small muted" style="margin-top:8px">Бүх зардал баримттай байна.</div>`}
  </div>`;
}

const KINDS=["Механизм","Тээврийн хэрэгсэл"];
const isVeh=e=>e&&e.kind===KINDS[1];
const mUnit=e=>isVeh(e)?"км":"мот/цаг";
const rUnit=e=>isVeh(e)?"л/100км":"л/цаг";
const n1=x=>(Math.round((+x||0)*10)/10).toLocaleString("en-US");
const n2=x=>(Math.round((+x||0)*100)/100).toLocaleString("en-US");
const MARK={high:["Их идсэн","st-no"],ok:["Хэвийн","st-paid"],low:["Хэмнэлттэй","st-ok"],first:["Эхний бүртгэл","tag"],learn:["Дундаж тогтоож байна","tag"],bad:["Заалт буруу","st-wait"]};
const markTag=k=>MARK[k]?`<span class="st ${MARK[k][1]}">${MARK[k][0]}</span>`:"";
function fuelCalcJS(eq,list,tol){
  list=list.slice().sort((a,b)=>a.meter-b.meter||String(a.date).localeCompare(String(b.date)));
  const per=isVeh(eq)?100:1, rates=[];
  list.forEach((f,i)=>{ f.delta=0; f.rate=0; f.base=0; f.mark=i===0?"first":""; if(i===0) return;
    f.delta=Math.round((f.meter-list[i-1].meter)*10)/10; if(!(f.delta>0)){ f.mark="bad"; return; }
    f.rate=Math.round(f.liters/f.delta*per*100)/100;
    f.base=eq.norm>0?eq.norm:(rates.length>=2?rates.reduce((a,x)=>a+x,0)/rates.length:0);
    f.mark=!f.base?"learn":f.rate>f.base*(1+tol)?"high":f.rate<f.base*(1-tol)?"low":"ok"; rates.push(f.rate); });
  const valid=list.filter(f=>f.rate>0), used=valid.reduce((a,f)=>a+f.liters,0), work=valid.reduce((a,f)=>a+f.delta,0), last=list[list.length-1];
  return {list,liters:list.reduce((a,f)=>a+f.liters,0),avg:work>0?Math.round(used/work*per*100)/100:0,work,lastMeter:last?last.meter:null,lastMark:last?last.mark:"",lastRate:last?last.rate:0,high:valid.filter(f=>f.mark==="high").length};
}

const DEF_CFG={ee:11.5,er:12.5,pit:10,cap:0,credits:[[500000,20000],[1000000,18000],[1500000,15000],[2000000,13000],[2500000,10000],[3000000,8000]]};
function ratingJS(tasks,name,td){
  const lim=dAdd(td,-60), mine=tasks.filter(x=>x.to===name&&x.due>=lim&&(x.due<td||x.status===TST.DONE||x.status===TST.NOT));
  if(!mine.length) return {n:0,score:null,label:"Үнэлгээгүй"};
  let pts=0,onTime=0,late=0,miss=0;
  mine.forEach(x=>{ if(x.status===TST.DONE){ if(!x.rep||x.rep.slice(0,10)<=x.due){pts++;onTime++;} else {pts+=0.5;late++;} } else miss++; });
  const sc=Math.round(pts/mine.length*100);
  return {n:mine.length,score:sc,onTime,late,miss,label:sc>=90?"Маш сайн":sc>=75?"Сайн":sc>=50?"Дунд":"Муу"};
}
function payCalc(u,ym,att,cfg){
  cfg=cfg||DEF_CFG; const recs=att.filter(a=>a[1]===u.name&&a[0].startsWith(ym));
  const days=recs.reduce((s,a)=>s+(PAYF[a[2]]||0),0), wage=+u.wage||0;
  let gross=u.wageType==="Сар"?Math.min(wage,wage*days/(u.wdays||22)):wage*days; gross=Math.round(gross);
  const base=cfg.cap>0?Math.min(gross,cfg.cap):gross, ee=Math.round(base*cfg.ee/100), er=Math.round(base*cfg.er/100);
  const cr=(cfg.credits||[]).find(c=>gross<=c[0]); const credit=gross>0&&cr?cr[1]:0;
  const pit=Math.max(0,Math.round((gross-ee)*cfg.pit/100-credit));
  return {days,gross,ee,er,pit,credit,net:gross-ee-pit};
}

async function exportPayXlsx(){
  const X=await loadLib(LIB_XLSX,"XLSX"), P=S.ppl, cfg=P.cfg||DEF_CFG, ym=S.pm, L=pplFiltered(), wb=X.utils.book_new();
  const rows=[["Ажилтан","Албан тушаал","Цалингийн төрөл","Цалин","Ажилласан өдөр","Бодогдсон цалин","НДШ ("+cfg.ee+"%)","ХХОАТ","Хөнгөлөлт","Гарт олгох","Ажил олгогчийн НДШ ("+cfg.er+"%)"]];
  L.forEach(u=>{ const p=payCalc(u,ym,P.att,cfg); rows.push([u.name,u.position||u.role,u.wageType,+u.wage||0,p.days,p.gross,p.ee,p.pit,p.credit,p.net,p.er]); });
  const ws=X.utils.aoa_to_sheet(rows); ws["!cols"]=[{wch:16},{wch:22},{wch:10},{wch:12},{wch:9},{wch:14},{wch:12},{wch:12},{wch:10},{wch:14},{wch:14}];
  X.utils.book_append_sheet(wb,ws,"Цалин "+ym);
  const ar=[["Огноо","Ажилтан","Төлөв","Согтуу","Тэмдэглэсэн"],...P.att.filter(a=>a[0].startsWith(ym)&&L.some(u=>u.name===a[1])).sort((a,b)=>a[0].localeCompare(b[0])||a[1].localeCompare(b[1])).map(a=>[a[0],a[1],a[2],a[3]?"Тийм":"",a[4]])];
  const w2=X.utils.aoa_to_sheet(ar); w2["!cols"]=[{wch:12},{wch:16},{wch:12},{wch:8},{wch:14}]; X.utils.book_append_sheet(wb,w2,"Ирц");
  const out=X.write(wb,{bookType:"xlsx",type:"array"});
  await saveBlob(fileSafe(`Аасгалдай_цалин_${ym}_${today()}.xlsx`),new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
}
document.addEventListener("click",async ev=>{

  if(D.lv){ const note=$("#ln_"+D.lv)?.value.trim()||""; if(D.ok==="0"&&!note){ toast("Татгалзах шалтгаанаа бичнэ үү"); $("#ln_"+D.lv).focus(); return; }

/* ---------- утасны мэдэгдэл ---------- */
function pushState(){
  if(MODE!=="http") return "off";
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent), standalone=navigator.standalone||matchMedia("(display-mode: standalone)").matches;
  if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window)) return ios&&!standalone?"ios":"no";
  return Notification.permission;
}
function pushCard(){
  const s=pushState();
  if(s==="off") return "";
  if(s==="granted") return `<div class="card urow"><div class="nm"><b>🔔 Мэдэгдэл асаалттай</b><span class="small muted">Шинэ хүсэлт, хариу, даалгавар ирэхэд энэ төхөөрөмжид мэдэгдэнэ.</span></div><button data-pushtest>Турших</button></div>`;
  if(s==="denied") return `<div class="card"><b>🔕 Мэдэгдэл хаалттай байна</b><div class="small muted">Утасны Settings → Notifications → Аасгалдай (эсвэл хөтчийн тохиргоо) хэсгээс зөвшөөрнө үү.</div></div>`;
  if(s==="ios") return `<div class="card"><b>🔔 Утсанд мэдэгдэл авах бол</b><div class="small muted">Safari-ийн доод талын Share (⬆︎) → «Add to Home Screen» дарж апп-ыг суулгаад, нүүр дэлгэц дээрх Аасгалдай дүрснээс нээнэ үү. Тэгэхэд энд «Мэдэгдэл асаах» товч гарна.</div></div>`;
  if(s==="no") return `<div class="card small muted">Энэ хөтөч утасны мэдэгдэл дэмжихгүй байна.</div>`;
  return `<button class="primary big" data-push>🔔 Мэдэгдэл асаах</button>`;
}
function b64uBytes(s){ const p="=".repeat((4-s.length%4)%4), b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(b,c=>c.charCodeAt(0)); }
async function pushEnable(ask){
  const perm=ask?await Notification.requestPermission():Notification.permission;
  if(perm!=="granted") throw new Error("Мэдэгдлийг зөвшөөрөөгүй байна");
  const reg=await navigator.serviceWorker.ready;
  const {key}=await api("pushKey");
  let sub=await reg.pushManager.getSubscription();
  if(sub&&store.get("aas_pushkey")!==key){ await sub.unsubscribe().catch(()=>{}); sub=null; }
  if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uBytes(key)});
  store.set("aas_pushkey",key);
  const j=sub.toJSON(); await api("pushSub",{sub:{endpoint:j.endpoint,keys:j.keys}});
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-push],[data-pushtest]"); if(!b) return;
  b.disabled=true;
  try{
    if(b.hasAttribute("data-push")){ await pushEnable(true); toast("🔔 Мэдэгдэл асаалаа"); }
    else { await pushEnable(false); const r=await api("pushTest"); toast(r.sent?"Туршилтын мэдэгдэл илгээлээ":"Энэ төхөөрөмж бүртгэгдээгүй байна"); }
  }catch(err){ toast(err.message||String(err)); }
  b.disabled=false; render();
});

  navigator.serviceWorker.register("sw.js").catch(()=>{});
}

netBanner(); if(S.user&&!S.user.mustChange){ readCache(); } render(); if(S.user&&!S.user.mustChange) load();
